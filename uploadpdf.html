<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Upload PDF to Drive & Share (Browser)</title>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
  </head>
  <body>
    <h2>Upload PDF </h2>
    <button id="authorize_button">Sign in with Google</button>
    <input type="file" id="file_input" accept="application/pdf" style="display:none" />
    <button id="upload_button" disabled>Choose & upload PDF</button>
    <div id="result"></div>

    <script type="module">
      // Replace with your own values from Google Cloud Console
      const CLIENT_ID = "380742045452-88bmvlovigjutotqoqdmnslmeeqb7j8f.apps.googleusercontent.com";
      const API_KEY = "AIzaSyAw8AKAhLBnG9bFnTZSlqddgdpKm7mUOgQ";
      const SCOPES = "https://www.googleapis.com/auth/drive";

      let tokenClient;
      let gapiInited = false;
      let gisInited = false;

      async function initGapi() {
        gapi.load("client", {
          callback: async () => {
            gapi.client.setApiKey(API_KEY);
            await gapi.client.load("https://www.googleapis.com/discovery/v1/apis/drive/v3/rest");
            gapiInited = true;
            checkReady();
          },
        });
      }

     

      function initGis() {

        // tokenClient = google.accounts.oauth2.initTokenClient({
        //   client_id: CLIENT_ID,
        //   scope: SCOPES,
        //   callback: (response) => {
        //     if (response.error) {
        //       throw response;
        //     }
        //     gisInited = true;
        //     checkReady();
        //   },
        // });

        tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (response) => {
      console.log("GIS token callback:", response);
      if (response.error) {
        console.error("Token error:", response);
        return;
      }
      // Store the token
      tokenClient.access_token = response.access_token;
      console.log("Access token stored:", tokenClient.access_token ? "yes" : "no");
      gisInited = true;
      checkReady();
    },
  });
  console.log("GIS client initialized");



      }

      function checkReady() {
        // if (gapiInited && gisInited) {
        //   document.getElementById("authorize_button").style.display = "none";
        //   document.getElementById("upload_button").disabled = false;
        //   document.getElementById("upload_button").style.display = "inline-block";
        // }
        console.log("checkReady called:", { gapiInited, gisInited });
        if (gapiInited && gisInited && tokenClient && tokenClient.access_token) {
          document.getElementById("authorize_button").style.display = "none";
          document.getElementById("upload_button").disabled = false;
          document.getElementById("upload_button").style.display = "inline-block";
          console.log("Upload button enabled");
        }
      }

      document.getElementById("authorize_button").onclick = () => {
        tokenClient.requestAccessToken({ prompt: "consent" });
      };

      document.getElementById("upload_button").onclick = () => {
        document.getElementById("file_input").click();
      };

      document.getElementById("file_input").onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        await uploadAndShare(file);
      };

    async function uploadAndShare(file) {
  const resultDiv = document.getElementById("result");
  resultDiv.textContent = "Uploading...";
  console.log("Token:", tokenClient && tokenClient.access_token ? "present" : "missing");
  if (!tokenClient || !tokenClient.access_token) {
    resultDiv.textContent = "No token available. Please sign in again.";
    return;
  }

  // 1. Build multipart body (metadata + file)
  const metadata = {
    name: file.name, // full name with extension
    mimeType: file.type || "application/pdf",
    parents: ["1NYfoLA4XrE5qStpozYKV1p5skvBkyHG_"],
  };

  const boundary = "-------MultipartBoundary-" + Math.random().toString(36).slice(2);

  const metadataPart =
    "--" + boundary + "\r\n" +
    "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
    JSON.stringify(metadata) + "\r\n";

  const filePart =
    "--" + boundary + "\r\n" +
    "Content-Type: " + (file.type || "application/pdf") + "\r\n\r\n";

  const endPart = "\r\n--" + boundary + "--";

  const body = new Blob([metadataPart, filePart, file, endPart], {
    type: "multipart/related; boundary=" + boundary,
  });

  // 2. Upload with multipart
  const uploadUrl =
    "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink,name";

  const uploadRes = await fetch(uploadUrl, {
    method: "POST",
    headers: {
      Authorization: `Bearer ${tokenClient.access_token}`,
      "Content-Type": "multipart/related; boundary=" + boundary,
    },
    body: body,
  });

  console.log("Upload status:", uploadRes.status);
  const uploadText = await uploadRes.text();
  console.log("Upload response:", uploadText);

  if (!uploadRes.ok) {
    resultDiv.textContent = "Upload failed. Check token and scopes. See console.";
    return;
  }

  const uploadData = JSON.parse(uploadText);
  const fileId = uploadData.id;
  console.log("Uploaded file name:", uploadData.name);

  if (!fileId) {
    resultDiv.textContent = "Upload succeeded but no file ID returned.";
    return;
  }

  // 3. Set permission: anyone with link can view
  const permRes = await fetch(
    `https://www.googleapis.com/drive/v3/files/${fileId}/permissions`,
    {
      method: "POST",
      headers: {
        Authorization: `Bearer ${tokenClient.access_token}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        type: "anyone",
        role: "reader",
        allowFileDiscovery: false,
      }),
    }
  );

  console.log("Permission status:", permRes.status);

  if (!permRes.ok) {
    resultDiv.textContent = "File uploaded, but failed to set public permission. See console.";
    return;
  }

  // 4. Get final link
  const linkRes = await fetch(
    `https://www.googleapis.com/drive/v3/files/${fileId}?fields=webViewLink,name`,
    {
      headers: {
        Authorization: `Bearer ${tokenClient.access_token}`,
      },
    }
  );
  const linkData = await linkRes.json();

  resultDiv.innerHTML = `
    <p>File uploaded and shared.</p>
    <p>Name: ${linkData.name}</p>
    <p>Shareable link: <a href="${linkData.webViewLink}" target="_blank">${linkData.webViewLink}</a></p>
  `;
}

 
   

      // Initialize on load
      initGapi();
      initGis();
    </script>
  </body>
</html>
